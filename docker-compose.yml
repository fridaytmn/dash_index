version: '3'
services:
  postgres:
    image: postgres:15
    hostname: "pg_server"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    ports:
      - '5432:5432'
    restart: unless-stopped
    network_mode: bridge
    volumes:
      - ${PGDATA_PATH}:/var/lib/postgresql/data
